name: Hourly Auto Scheduler

on:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟触发一次
  workflow_dispatch: {}

concurrency:
  group: hourly-auto-scheduler
  cancel-in-progress: true

jobs:
  run-scheduler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Diagnose CPA DNS
        env:
          UPLOAD_API_URL: ${{ secrets.UPLOAD_API_URL }}
        run: |
          python - <<'PY'
          from urllib.parse import urlparse
          import socket
          import os

          raw = os.environ.get("UPLOAD_API_URL", "").strip()
          parsed = urlparse(raw)
          print(f"UPLOAD_API_URL set: {'yes' if raw else 'no'}")
          host = parsed.hostname or ""
          if not host:
              print("CPA endpoint host present: no")
          else:
              try:
                  socket.getaddrinfo(host, parsed.port or 443)
                  print("CPA endpoint DNS lookup: success")
              except Exception:
                  print("CPA endpoint DNS lookup: failed")
          print(f"CPA endpoint scheme valid: {'yes' if parsed.scheme in ('http', 'https') else 'no'}")
          PY

      - name: Run auto_scheduler
        env:
          PYTHONUNBUFFERED: 1
          LAMAIL_DOMAIN: ${{ secrets.LAMAIL_DOMAIN }}
          LAMAIL_API_KEY: ${{ secrets.LAMAIL_API_KEY }}
          UPLOAD_API_URL: ${{ secrets.UPLOAD_API_URL }}
          UPLOAD_API_TOKEN: ${{ secrets.UPLOAD_API_TOKEN }}
          MAIL_PROVIDER: ${{ secrets.MAIL_PROVIDER }}
          CFMAIL_WORKER_DOMAIN: ${{ secrets.CFMAIL_WORKER_DOMAIN }}
          CFMAIL_EMAIL_DOMAIN: ${{ secrets.CFMAIL_EMAIL_DOMAIN }}
          CFMAIL_ADMIN_PASSWORD: ${{ secrets.CFMAIL_ADMIN_PASSWORD }}
        run: |
          # 如果系统有 `uv` 命令则使用用户期望的命令，否则降级执行 python
          if command -v uv >/dev/null 2>&1; then
            uv run auto_scheduler.py
          else
            python -u auto_scheduler.py
          fi

      - name: Delete old workflow runs
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'scheduler.yml',
              per_page: 100,
            });
            const toDelete = runs.data.workflow_runs
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .slice(1);
            for (const run of toDelete) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
            }
